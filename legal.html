<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умови</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .doc h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 26px 0 8px; }
        .doc p, .doc li { font-size: 13px; line-height: 1.65; color: #333; margin-bottom: 8px; }
        .doc ul { list-style: disc; padding-left: 20px; }
        .miss { background: #fde68a; padding: 0 3px; }
    </style>
</head>
<body class="bg-white text-black">
<div class="max-w-md mx-auto px-6 py-8">
    <a href="index.html" class="text-[11px] tracking-widest uppercase text-gray-500 hover:text-black">← На головну</a>
    <h1 id="title" class="text-xl mt-5 mb-1"></h1>
    <div id="doc" class="doc"></div>
    <nav id="nav" class="mt-10 pt-5 border-t border-gray-100 text-[11px] text-gray-500 space-y-1.5"></nav>
</div>

<script>
const DOCS = {
    offer: 'Публічна оферта',
    delivery: 'Доставка й оплата',
    returns: 'Повернення й обмін',
    privacy: 'Політика конфіденційності'
};
const params = new URLSearchParams(location.search);
const key = DOCS[params.get('doc')] ? params.get('doc') : 'offer';

fetch(new URL(SUPABASE_URL.trim()).origin + '/rest/v1/settings?select=*', { headers: { apikey: SUPABASE_ANON_KEY.trim() }, cache: 'no-store' })
    .then(r => r.json()).then(rows => render(Object.fromEntries(rows.map(r => [r.key, r.value]))))
    .catch(() => render({}));

function render(S) {
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    // підставляє значення з налаштувань; якщо порожньо — жовта позначка, щоб не забути заповнити
    const v = (k, label) => S[k] && S[k].trim() ? esc(S[k].trim()) : '<span class="miss">[' + label + ']</span>';
    const store = v('store_name', 'назва магазину');
    const fop = v('fop_name', 'ПІБ ФОП') + ', РНОКПП ' + v('fop_id', 'РНОКПП') + ', ' + v('fop_address', 'адреса');
    const contacts = 'e-mail: ' + v('contact_email', 'e-mail') + ', тел.: ' + v('contact_phone', 'телефон');
    const pre = v('prepay_amount', 'сума передоплати');
    const rd = v('return_days', 'днів');
    const sd = v('ship_days', 'термін відправлення');
    const note = k => S[k] ? esc(S[k]) : '';

    const T = {
        offer: `
<p>Ця публічна оферта (далі — «Оферта») є офіційною пропозицією продавця укласти договір купівлі-продажу товару на умовах, викладених нижче.</p>
<h2>1. Продавець</h2>
<p>Інтернет-магазин «${store}». Продавець: ФОП ${fop}. Контакти: ${contacts}.</p>
<h2>2. Предмет договору</h2>
<p>Продавець зобов'язується передати покупцю товар, обраний на сайті, а покупець — оплатити й прийняти його. Договір вважається укладеним з моменту оформлення замовлення на сайті та його підтвердження продавцем.</p>
<h2>3. Замовлення</h2>
<ul>
<li>Покупець самостійно обирає товар, розмір і кількість та вказує достовірні контактні дані й дані для доставки.</li>
<li>Після оформлення товар резервується за покупцем. Продавець може зв'язатися з покупцем для уточнення деталей.</li>
<li>Якщо товару немає в потрібній кількості, продавець повідомляє про це покупця та пропонує заміну або повертає кошти.</li>
</ul>
<h2>4. Ціна та оплата</h2>
<ul>
<li>Усі ціни на сайті вказані в гривнях (UAH).</li>
<li>Покупець може обрати повну оплату або передоплату у розмірі ${pre} грн із доплатою решти суми під час отримання.</li>
<li>${note('prepay_note')}</li>
</ul>
<h2>5. Доставка</h2>
<p>Доставка здійснюється службою «Нова пошта» протягом ${sd} робочих днів після підтвердження оплати. Деталі — на сторінці «Доставка й оплата».</p>
<h2>6. Повернення й обмін</h2>
<p>Покупець має право повернути товар належної якості протягом ${rd} днів з моменту отримання на умовах, визначених законодавством та сторінкою «Повернення й обмін».</p>
<h2>7. Відповідальність</h2>
<p>Сторони несуть відповідальність відповідно до чинного законодавства України. Продавець не відповідає за затримки, що виникли з вини перевізника, а також за наслідки вказання покупцем недостовірних даних.</p>
<h2>8. Персональні дані</h2>
<p>Оформлюючи замовлення, покупець погоджується на обробку своїх персональних даних відповідно до Політики конфіденційності.</p>
<h2>9. Реквізити продавця</h2>
<p>${fop}. ${contacts}.</p>`,

        delivery: `
<h2>Доставка</h2>
<ul>
<li>Відправляємо замовлення службою «Нова пошта» у відділення або поштомат на ваш вибір.</li>
<li>Відправлення — протягом ${sd} робочих днів після підтвердження оплати.</li>
<li>Номер ТТН надсилаємо після відправлення.</li>
<li>Вартість доставки сплачується за тарифами перевізника під час отримання, якщо не вказано інше.</li>
</ul>
<h2>Оплата</h2>
<ul>
<li>Усі розрахунки — у гривнях.</li>
<li><b>Повна оплата.</b> Ви оплачуєте всю суму замовлення наперед.</li>
<li><b>Передоплата ${pre} грн.</b> Решту суми ви оплачуєте під час отримання на «Новій пошті».</li>
<li>${note('prepay_note')}</li>
</ul>
<h2>Огляд посилки</h2>
<p>Перевіряйте комплектацію та стан товару під час отримання у відділенні перевізника.</p>
<p>Продавець: ФОП ${fop}. ${contacts}.</p>`,

        returns: `
<h2>Строки</h2>
<p>Відповідно до Закону України «Про захист прав споживачів» ви можете повернути або обміняти непродовольчий товар належної якості протягом ${rd} днів з моменту отримання, якщо його не використовували, збережено товарний вигляд, ярлики та споживчі властивості. Товари, що входять до переліку, визначеного законодавством, поверненню й обміну не підлягають.</p>
<h2>Як оформити повернення</h2>
<ul>
<li>Зв'яжіться з нами: ${contacts}. Вкажіть номер замовлення та причину.</li>
<li>Відправте товар «Новою поштою» за реквізитами, які ми повідомимо.</li>
<li>Після отримання та перевірки товару ми повертаємо кошти тим самим способом, яким ви платили.</li>
</ul>
<h2>Витрати</h2>
<p>${note('return_shipping_note')}</p>
<h2>Передоплата</h2>
<p>${note('prepay_note')}</p>
<h2>Товар неналежної якості</h2>
<p>Якщо ви отримали товар з дефектом, зв'яжіться з нами якнайшвидше та додайте фото. Ми вирішимо питання відповідно до законодавства.</p>
<p>Продавець: ФОП ${fop}.</p>`,

        privacy: `
<h2>Які дані ми збираємо</h2>
<p>Під час оформлення замовлення ми збираємо: ім'я, номер телефону, місто та дані відділення доставки, коментар до замовлення.</p>
<h2>Навіщо</h2>
<ul>
<li>Щоб обробити й доставити замовлення, зв'язатися з вами щодо нього.</li>
<li>Щоб виконати вимоги законодавства та облікові вимоги.</li>
</ul>
<h2>Кому передаємо</h2>
<p>Дані передаються лише тим, хто необхідний для виконання замовлення: службі доставки та платіжним сервісам. Ми не продаємо ваші дані.</p>
<h2>Зберігання та ваші права</h2>
<p>Дані зберігаються стільки, скільки потрібно для виконання замовлення та вимог закону. Ви можете звернутися з проханням уточнити, виправити або видалити ваші дані: ${contacts}.</p>
<h2>Файли cookie та пам'ять браузера</h2>
<p>Сайт зберігає у вашому браузері вміст кошика, щоб він не зникав після оновлення сторінки.</p>
<p>Відповідальна особа: ФОП ${fop}.</p>`
    };

    document.title = DOCS[key] + (S.store_name ? ' — ' + S.store_name : '');
    document.getElementById('title').textContent = DOCS[key];
    document.getElementById('doc').innerHTML = T[key];
    document.getElementById('nav').innerHTML = Object.keys(DOCS).filter(k => k !== key)
        .map(k => '<p><a class="hover:text-black underline" href="legal.html?doc=' + k + '">' + DOCS[k] + '</a></p>').join('');
}
</script>
</body>
</html>
